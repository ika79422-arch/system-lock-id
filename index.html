<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>System Lock-ID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- Animated background layers -->
  <div class="bg">
    <div class="bg-grid"></div>
    <div class="bg-circuit"></div>
    <div class="bg-scanlines"></div>
    <canvas id="binaryRain" aria-hidden="true"></canvas>
    <div class="bg-vignette"></div>
  </div>

  <main class="wrap">
    <section class="panel" role="region" aria-label="System Lock-ID Demo Panel">
      <div class="panel-top">
        <div class="panel-corners" aria-hidden="true"></div>
        <div class="panel-title">
          <div class="electric" aria-hidden="true"></div>
          <h1>SYSTEM LOCK-ID</h1>
          <button class="close" type="button" aria-label="Tutup (demo)" title="Demo">
            ✕
          </button>
        </div>
      </div>

      <form id="lockForm" class="form" autocomplete="off">
        <div class="row">
          <label for="userId">User ID</label>
          <div class="control">
            <input id="userId" name="userId" type="text" placeholder="(kosong)" value="" />
          </div>
        </div>

        <div class="row">
          <label for="provider">Provider</label>
          <div class="control select">
            <span class="chip" aria-hidden="true"></span>
            <select id="provider" name="provider">
              <option value="PG SOFT" selected>PG SOFT</option>
              <option value="PRAGMATIC">PRAGMATIC</option>
            </select>
            <span class="chev" aria-hidden="true">▾</span>
          </div>
        </div>

        <div class="row">
          <label for="game">Game</label>
          <div class="control select">
            <span class="tri" aria-hidden="true">▲</span>
            <select id="game" name="game">
              <option value="MAHJONG WAYS" selected>MAHJONG WAYS</option>
            </select>
            <span class="chev" aria-hidden="true">▾</span>
          </div>
        </div>

        <div class="row">
          <label for="server">Server</label>
          <div class="control select muted">
            <span class="tri" aria-hidden="true">▲</span>
            <select id="server" name="server">
              <option value="ASIA TENGGARA" selected>ASIA TENGGARA</option>
            </select>
            <span class="chev" aria-hidden="true">▾</span>
          </div>
        </div>

        <div class="row">
          <label for="winrate">Winrate</label>
          <div class="control select muted">
            <span class="dot" aria-hidden="true"></span>
            <select id="winrate" name="winrate">
              <option value="99%" selected>99%</option>
            </select>
            <span class="chev" aria-hidden="true">▾</span>
          </div>
        </div>

        <div class="row">
          <label for="kode">Kode Aktivasi</label>
          <div class="control">
            <input id="kode" name="kode" type="text" inputmode="numeric" value="80.000" />
          </div>
        </div>

        <div class="actions">
          <button class="btn" type="submit">
            AKTIFKAN
            <span class="btn-glow" aria-hidden="true"></span>
          </button>
        </div>

        <p class="note">
          * UI demo cyber. Tidak ada jaminan hasil/keuntungan.
        </p>

        <div id="summary" class="summary" aria-live="polite" hidden></div>
      </form>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
